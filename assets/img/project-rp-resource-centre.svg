<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Arial, Helvetica, sans-serif">
  <title>RP Resource Centre deployment: browser to Caddy HTTPS proxy to Docker Compose running the Node.js app and MySQL on AWS EC2</title>
  <rect width="800" height="450" fill="#353A46"/>
  <!-- AWS server -->
  <rect x="250" y="70" width="500" height="320" rx="14" fill="#1B1E26" stroke="#B8BCC6" stroke-opacity="0.4"/>
  <text x="274" y="104" font-size="13" letter-spacing="2" fill="#B8BCC6">AWS EC2 · UBUNTU 24.04</text>
  <!-- Browser -->
  <rect x="50" y="190" width="140" height="70" rx="10" fill="#111318" stroke="#B8BCC6" stroke-opacity="0.4"/>
  <text x="120" y="222" font-size="15" font-weight="bold" fill="#F1F1F1" text-anchor="middle">Browser</text>
  <text x="120" y="244" font-size="12" fill="#B8BCC6" text-anchor="middle">https://</text>
  <path d="M190 225h72" stroke="#F1F1F1" stroke-width="2"/><path d="M262 225l-10-6v12z" fill="#F1F1F1"/>
  <!-- Caddy -->
  <rect x="274" y="190" width="150" height="70" rx="10" fill="#111318" stroke="#B8BCC6" stroke-opacity="0.4"/>
  <text x="349" y="222" font-size="15" font-weight="bold" fill="#F1F1F1" text-anchor="middle">Caddy</text>
  <text x="349" y="244" font-size="12" fill="#B8BCC6" text-anchor="middle">HTTPS proxy</text>
  <path d="M424 225h32" stroke="#F1F1F1" stroke-width="2"/><path d="M456 225l-10-6v12z" fill="#F1F1F1"/>
  <!-- Docker Compose -->
  <rect x="468" y="130" width="258" height="236" rx="12" fill="none" stroke="#B8BCC6" stroke-dasharray="6 6"/>
  <text x="488" y="160" font-size="12" letter-spacing="2" fill="#B8BCC6">DOCKER COMPOSE</text>
  <rect x="492" y="180" width="210" height="70" rx="10" fill="#353A46"/>
  <text x="597" y="212" font-size="15" font-weight="bold" fill="#F1F1F1" text-anchor="middle">Node.js app</text>
  <text x="597" y="234" font-size="12" fill="#B8BCC6" text-anchor="middle">Express.js · EJS</text>
  <path d="M597 250v22" stroke="#F1F1F1" stroke-width="2"/>
  <rect x="492" y="272" width="210" height="70" rx="10" fill="#353A46"/>
  <text x="597" y="304" font-size="15" font-weight="bold" fill="#F1F1F1" text-anchor="middle">MySQL 8</text>
  <text x="597" y="326" font-size="12" fill="#B8BCC6" text-anchor="middle">database container</text>
</svg>
